<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Project</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e8284a",
              secondary: "#1e40af",
              accent: "",
              background: "#00A300",
              border: "#00A300",
              hover: "#00A300",
              active: "",
              focus: "",
            },
          },
        },
      };
    </script>
  </head>
  <body class="light">
    <!-- Hearder -->
    <div
      class="flex w-full text-black mx-auto py-1 px-5 lg:px-28 space-x-4 text-center text-white bg-primary dark:primary dark:text-gray-200 justify-between"
    >
      <div>Notice</div>

      <!-- Social Icons -->
      <div class="flex items-center space-x-4 text-white">
        <a href="#" class="hover:text-blue-500">
          <i class="fa-brands fa-facebook-f text-xl"></i>
        </a>

        <a href="#" class="hover:text-blue-400">
          <i class="fa-brands fa-twitter text-xl"></i>
        </a>

        <a href="#" class="hover:text-pink-500">
          <i class="fa-brands fa-instagram text-xl"></i>
        </a>

        <a href="#" class="hover:text-blue-600">
          <i class="fa-brands fa-linkedin text-xl"></i>
        </a>
      </div>
    </div>
    <header class="md:px-5 w-full bg-white dark:bg-gray-900 sticky top-0">
      <div class="container w-full mx-auto py-3 px-4">
        <div class="flex justify-between">
          <!-- LOGO -->
          <div class="logo w-32 h-auto">
            <a href="#">
              <img src="Kids-city-nepal-logo.png" alt="logo" srcset=""
            /></a>
          </div>
          <div class="flex justify-between items-center gap-5">
            <form
              class="flex gap-0 search-box px-2 md:px-4 py-1 border-2 rounded-2xl md:rounded-3xl"
            >
              <input
                type="text"
                class="bg-transparent focus:outline-none focus:ring-0"
                placeholder="searching..."
              />
              <a href="#"
                ><i
                  class="fas fa-search hover:text-primary dark:text-white dark:hover:text-primary"
                ></i
              ></a>

              <!-- <button type="submit">Search</button> -->
            </form>
            <!-- Menu -->
            <nav>
              <ul class="hidden md:flex gap-5 dark:text-gray-100">
                <li>
                  <a
                    href="#"
                    class="hover:text-primary dark:text-white dark:hover:text-primary"
                    >Home</a
                  >
                </li>
                <li>
                  <a
                    href="#"
                    class="hover:text-primary dark:text-white dark:hover:text-primary"
                    >Shop</a
                  >
                </li>
                <li>
                  <a
                    href="#"
                    class="hover:text-primary dark:text-white dark:hover:text-primary"
                    >About</a
                  >
                </li>

                <li>
                  <a
                    href="#"
                    class="hover:text-primary dark:text-white dark:hover:text-primary"
                    >Contact</a
                  >
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </header>
    <div
      class="hidden lg:flex w-full bg-white text-gray-800 text-sm mx-auto py-3 px-28 justify-between dark:bg-gray-900"
    >
      <ul class="flex gap-10 dark:text-gray-800 align-center">
        <li>
          <a
            href="#"
            class="gap-10 hover:text-primary dark:text-white dark:hover:text-primary"
            ><i class="fa-solid fa-baby pr-1"></i>Toys</a
          >
        </li>
        <li>
          <a
            href="#"
            class="hover:text-primary dark:text-white dark:hover:text-primary"
            ><i class="fa-solid fa-hands-holding-child pr-1"></i>Baby Care</a
          >
        </li>
        <li>
          <a
            href="#"
            class="hover:text-primary dark:text-white dark:hover:text-primary"
            ><i class="fa-solid fa-shirt pr-1"></i>Kids Clothes</a
          >
        </li>
        <li>
          <a
            href="#"
            class="hover:text-primary dark:text-white dark:hover:text-primary"
            ><i class="fa-solid fa-shoe-prints pr-1"></i>Kids Shoes</a
          >
        </li>
        <li>
          <a
            href="#"
            class="hover:text-primary dark:text-white dark:hover:text-primary"
            ><i class="fa-solid fa-volleyball pr-1"></i>Sports</a
          >
        </li>
      </ul>
      <div class="flex items-center text-white space-x-2">
        <i class="fa-solid fa-phone text-primary"></i>
        <span class="font-medium text-gray-700 dark:text-gray-200"
          >+977-9800000000</span
        >
      </div>
    </div>
    <main>
      <section class="w-full h-screen bg-slate-200">Hero</section>
      <section class="w-full h-screen">Features: Why Choose Us?</section>
      <section class="w-full h-screen bg-slate-200">Popular Products</section>
      <section class="w-full h-screen bg-slate-200">Best Sellers</section>
      <section class="w-full h-screen">Mobile Phone</section>
      <section class="w-full h-screen bg-slate-200">Form</section>
      <section class="w-full h-64 bg-Blue-500">CTA</section>
      <section class="w-full h-screen bg-slate-200">Testimonials</section>
    </main>
    <footer class="w-full h-64 bg-blue-700"></footer>
  </body>
</html>
